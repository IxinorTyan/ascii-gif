<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII 字符动画</title>
<style>
  :root { --ascii-foreground: #000; --ascii-background: #fff; --ascii-font-size: 10px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #16191e; color: #edf0f5; font: 14px system-ui, sans-serif; }
  #stage { overflow: auto; padding: 24px; min-height: 65vh; display: grid; place-items: center; }
  #ascii { margin: 0; width: max-content; color: var(--ascii-foreground); background: var(--ascii-background); font-family: Consolas, 'Courier New', monospace; font-size: var(--ascii-font-size); line-height: 1; letter-spacing: 0; font-variant-ligatures: none; white-space: pre; }
  #controls { padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  button, select, input { font: inherit; }
  button, select { padding: 6px 12px; }
  #seek { flex: 1; min-width: 120px; }
  label { display: flex; align-items: center; gap: 6px; }
  body.embed { background: transparent; }
  .embed #controls { display: none; }
  .embed #stage { padding: 0; min-height: 0; display: block; }
</style>
<main id="stage"><pre id="ascii" aria-label="ASCII 字符动画"></pre></main>
<div id="controls">
  <button id="toggle" type="button">暂停</button>
  <input id="seek" aria-label="播放进度" type="range" min="0" value="0" step="1">
  <output id="time"></output>
  <label><input id="loop" type="checkbox" checked>循环播放</label>
  <label>速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
  <label>字号<input id="size" type="range" min="4" max="24" value="10"></label>
  <label>字符<input id="foreground" type="color" aria-label="单色字符颜色"></label>
  <label>背景<input id="background" type="color" aria-label="背景颜色"></label>
</div>
<script id="ascii-data" type="application/json">__ASCII_DATA__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('ascii-data').textContent);
  const frames = data.frames;
  const get = id => document.getElementById(id);
  const pre = get('ascii'), seek = get('seek'), toggle = get('toggle');
  const ends = []; let duration = 0;
  for (const frame of frames) { duration += frame.duration; ends.push(duration); }
  let position = 0, playing = true, previous = performance.now(), shown = -1;
  seek.max = duration;
  function frameAt(ms) {
    let low = 0, high = ends.length - 1;
    while (low < high) { const mid = (low + high) >> 1; if (ms < ends[mid]) high = mid; else low = mid + 1; }
    return low;
  }
  function render() {
    const index = frameAt(position), frame = frames[index];
    if (shown !== index) {
      shown = index;
      if (!frame.colors.length) pre.textContent = frame.text;
      else {
        const fragment = document.createDocumentFragment();
        let colorIndex = 0, run = '', color = null;
        const flush = () => { if (run) { const span = document.createElement('span'); span.style.color = color; span.textContent = run; fragment.append(span); run = ''; } };
        for (const char of frame.text) {
          if (char === '\n') { flush(); fragment.append(document.createTextNode('\n')); continue; }
          const next = frame.colors[colorIndex++];
          if (next !== color) { flush(); color = next; }
          run += char;
        }
        flush(); pre.replaceChildren(fragment);
      }
    }
    seek.value = position;
    get('time').textContent = `${(position / 1000).toFixed(1)} / ${(duration / 1000).toFixed(1)} 秒`;
    toggle.textContent = playing ? '暂停' : '播放';
  }
  function advance(now) {
    if (playing) {
      position += (now - previous) * Number(get('speed').value);
      if (position >= duration) {
        if (get('loop').checked) position %= duration;
        else { position = duration; playing = false; }
      }
    }
    previous = now; render();
  }
  function tick(now) { advance(now); requestAnimationFrame(tick); }
  toggle.onclick = () => { advance(performance.now()); if (!playing && position >= duration) position = 0; playing = !playing; render(); };
  seek.oninput = () => { position = Number(seek.value); previous = performance.now(); render(); };
  get('size').oninput = event => document.documentElement.style.setProperty('--ascii-font-size', `${event.target.value}px`);
  for (const name of ['foreground', 'background']) {
    get(name).value = data[name];
    document.documentElement.style.setProperty(`--ascii-${name}`, data[name]);
    get(name).oninput = event => document.documentElement.style.setProperty(`--ascii-${name}`, event.target.value);
  }
  get('foreground').disabled = frames[0].colors.length > 0;
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  render(); requestAnimationFrame(tick);
})();
</script>
</html>
